id: climate
pad_top: 40
pad_bottom: 40
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Grid
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 4
    pad_right: 4
    scrollbar_mode: "off"
    scrollable: true
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 6
      pad_row: 6
    widgets:
    - obj:
        width: 32%
        height: 76
        bg_color: 0x252C37
        radius: 14
        border_width: 0
        pad_left: 10
        pad_right: 10
        pad_top: 10
        pad_bottom: 8
        scrollbar_mode: "off"
        widgets:
        - label:
            text: "Phase 1"
            text_font: roboto_sm
            text_color: 0x8B96A8
            align: TOP_LEFT
        - label:
            id: grid_phase_1_power_value
            width: 110
            text: "--"
            text_font: roboto_md
            text_color: 0xFFFFFF
            text_align: RIGHT
            align: BOTTOM_RIGHT
            y: -18
        - bar:
            id: grid_phase_1_power_bar
            width: 100%
            height: 10
            align: BOTTOM_MID
            min_value: 0
            max_value: 1100
            value: 0
            radius: 6
            bg_color: 0x151A22
            indicator:
              bg_color: 0xF5B041
    - obj:
        width: 32%
        height: 76
        bg_color: 0x252C37

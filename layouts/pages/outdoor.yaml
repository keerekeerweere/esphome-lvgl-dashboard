            id: solar_l1_kw_value
            width: 110
            text: "--"
            text_font: roboto_md
            text_color: 0xFFFFFF
            text_align: RIGHT
            align: BOTTOM_RIGHT
            y: -18
        - bar:
            id: solar_l1_kw_bar
            width: 100%
            height: 10
            align: BOTTOM_MID
            min_value: 0
            max_value: 320
            value: 0
            radius: 6
            bg_color: 0x151A22

id: outdoor
pad_top: 40
pad_bottom: 40
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Solar
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 4
    pad_right: 4
    scrollbar_mode: "off"
    scrollable: true
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 6
      pad_row: 6
    widgets:
    - obj:
        width: 100%
        height: 2
        bg_color: 0x555555
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        width: 100%
        height: 56
        bg_color: 0x2A2E38
        radius: 12
        border_width: 0
        pad_left: 10
        pad_right: 10
        scrollbar_mode: "off"
        widgets:
        - label:
            text: "Solar Total"
            text_font: roboto_sm
            text_color: 0x888888
            align: TOP_LEFT
            y: 8
        - label:
            id: solar_total_value
            text: "--"
            text_font: roboto_md
            align: BOTTOM_LEFT
            y: -8

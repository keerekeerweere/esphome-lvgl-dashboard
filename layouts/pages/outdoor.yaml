id: outdoor
pad_top: 40
pad_bottom: 40
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Solar
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 4
    pad_right: 4
    scrollbar_mode: "off"
    scrollable: true
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 6
      pad_row: 6
    widgets:
    - obj:
        width: 100%
        height: 88
        bg_color: 0x1F2B24
        radius: 16
        border_width: 0
        pad_left: 12
        pad_right: 12
        pad_top: 12
        pad_bottom: 10
        scrollbar_mode: "off"
        widgets:
        - label:
            text: "Solar Total"
            text_font: roboto_sm
            text_color: 0x93A48F
            align: TOP_LEFT
        - label:
            id: solar_total_value
            width: 180
            text: "--"
            text_font: roboto_xl
            text_color: 0xFFFFFF
            text_align: RIGHT
            align: RIGHT_MID
            y: -2
        - bar:
            id: solar_total_bar
            width: 100%
            height: 14
            align: BOTTOM_MID
            min_value: 0
            max_value: 720
            value: 0
            radius: 8
            bg_color: 0x11181A
            indicator:
              bg_color: 0x4CAF50
    - obj:
        width: 32%
        height: 76
        bg_color: 0x242F28
        radius: 14
        border_width: 0
        pad_left: 10
        pad_right: 10
        pad_top: 10
        pad_bottom: 8
        scrollbar_mode: "off"
        widgets:
        - label:
            text: "Solar L1"
            text_font: roboto_sm
            text_color: 0x93A48F
            align: TOP_LEFT

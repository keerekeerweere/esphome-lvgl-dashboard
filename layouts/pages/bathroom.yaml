id: bathroom
pad_top: 40
pad_bottom: 40
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Bathroom
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 4
    pad_right: 4
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 6
      pad_row: 6
    widgets:
    # Separator at the top
    - obj:
        width: 100%
        height: 2
        bg_color: 0x555555
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - button:
        # bathroom light
        <<: !include
          file: ../widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
          vars:
            uid: bathroom_light
            entity_id: switch.sonoff_1001275189_1
            text: Main
            width: 32%
            height: 72
        on_short_click:
        - homeassistant.service:
            service: switch.toggle
            data: { entity_id: switch.sonoff_1001275189_1 }
    - button:
        # mirror
        <<: !include
          file: ../widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
          vars:
            uid: mirror
            entity_id: switch.sonoff_1001275189_2
            text: Mirror
            width: 32%
            height: 72
        on_short_click:
        - homeassistant.service:
            service: switch.toggle
            data: { entity_id: switch.sonoff_1001275189_2 }
    - button:
        # fan
        <<: !include
          file: ../widgets/buttons/icon_text_buttons/fan_buttons/widget.yaml
          vars:
            uid: fan
            entity_id: switch.sonoff_1000af2f21_1
            text: Fan
            width: 32%
            height: 72
        on_short_click:
        - homeassistant.service:
            service: switch.toggle
            data: { entity_id: switch.sonoff_1000af2f21_1 }
    # Separator before Temp/Humidity
    - obj:
        width: 100%
        height: 2
        bg_color: 0x555555
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        # temperature sensor
        width: 49%
        height: 56
        bg_color: 0x2A2E38
        radius: 12
        border_width: 0
        pad_left: 10
        pad_right: 10
        scrollbar_mode: "off"
        widgets:
        - label:
            text: "Temperature"
            text_font: roboto_sm
            text_color: 0x888888
            align: TOP_LEFT
            y: 8
        - label:
            id: bathroom_temp_value
            text: "..."
            text_font: roboto_md
            align: BOTTOM_LEFT
            y: -8
    - obj:
        # humidity sensor
        width: 49%
        height: 56
        bg_color: 0x2A2E38
        radius: 12
        border_width: 0
        pad_left: 10
        pad_right: 10
        scrollbar_mode: "off"
        widgets:
        - label:
            text: "Humidity"
            text_font: roboto_sm
            text_color: 0x888888
            align: TOP_LEFT
            y: 8
        - label:
            id: bathroom_humidity_value
            text: "..."
            text_font: roboto_md
            align: BOTTOM_LEFT
            y: -8

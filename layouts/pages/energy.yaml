id: energy
pad_top: 40
pad_bottom: 40
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Overview
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 4
    pad_right: 4
    scrollbar_mode: "off"
    scrollable: true
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 6
      pad_row: 6
    widgets:
    - obj:
        width: 100%
        height: 98
        bg_color: 0x202733
        radius: 16
        border_width: 0
        pad_left: 12
        pad_right: 12
        pad_top: 12
        pad_bottom: 10
        scrollbar_mode: "off"
        widgets:
        - label:
            text: "Grid Power"
            text_font: roboto_sm
            text_color: 0x94A0B2
            align: TOP_LEFT
        - label:
            id: overview_grid_power_value
            width: 180
            text: "--"
            text_font: roboto_xl
            text_color: 0xFFFFFF
            text_align: RIGHT
            align: RIGHT_MID
            y: -6
        - label:
            text: "Magnitude"
            text_font: roboto_sm
            text_color: 0x6F7A8A
            align: LEFT_MID
            y: 14
        - obj:
            width: 100%
            height: 14
            align: BOTTOM_MID
            radius: 8
            bg_color: 0x11161E
            border_width: 0
            clip_corner: true
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
            - obj:
                width: 50%
                height: 100%
                align: LEFT_MID
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollbar_mode: "off"
                widgets:
                - obj:
                    id: overview_grid_power_fill_left
                    width: 0
                    height: 100%
                    align: RIGHT_MID
                    bg_color: 0x41C97B
                    border_width: 0
                    radius: 0
                    scrollbar_mode: "off"
            - obj:
                width: 50%
                height: 100%
                align: RIGHT_MID
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollbar_mode: "off"
                widgets:
                - obj:
                    id: overview_grid_power_fill_right
                    width: 0
                    height: 100%
                    align: LEFT_MID
                    bg_color: 0xF5B041
                    border_width: 0
                    radius: 0
                    scrollbar_mode: "off"
            - obj:
                width: 2
                height: 14
                align: CENTER
                bg_color: 0xD0D6E0
                border_width: 0
                radius: 0
                scrollbar_mode: "off"
    - obj:
        width: 32%
        height: 72
        bg_color: 0x272D38
        radius: 14
        border_width: 0
        pad_left: 10
        pad_right: 10
        pad_top: 10
        pad_bottom: 8
        scrollbar_mode: "off"
        widgets:
        - label:
            text: "Peak Month"
            text_font: roboto_sm
            text_color: 0x8B96A8
            align: TOP_LEFT
        - label:

grid_phase_1_power_sensor:
  sensor:
  - id: grid_phase_1_power
    platform: homeassistant
    entity_id: sensor.esp32_s3_energy_meter_grid_power_phase_1
    on_value:
    - lvgl.label.update:
        id: grid_phase_1_power_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[20];
          snprintf(buf, sizeof(buf), "%+.2f kW", x);
          return std::string(buf);


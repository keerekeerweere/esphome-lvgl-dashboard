overview_grid_power_sensor:
  sensor:
  - id: overview_grid_power
    platform: homeassistant
    entity_id: sensor.esp32_s3_energy_meter_grid_power
    on_value:
    - if:
        condition:
          lambda: 'return "${debug_sensor_logs}" == "true";'
        then:
        - logger.log:
            format: "overview_grid_power update: %.3f"
            args: [ "x" ]
    - lvgl.label.update:
        id: overview_grid_power_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[20];
          snprintf(buf, sizeof(buf), "%+.2f kW", x);
          return std::string(buf);
    - lvgl.widget.update:
        id: overview_grid_power_fill_left
        width: !lambda |-
          if (std::isnan(x) || x >= 0.0f) return 0;
          float magnitude = -x;
          if (magnitude > 11.0f) magnitude = 11.0f;
          return (int) lroundf((magnitude / 11.0f) * 136.0f);
    - lvgl.widget.update:
        id: overview_grid_power_fill_right
        width: !lambda |-
          if (std::isnan(x) || x <= 0.0f) return 0;
          float magnitude = x;
          if (magnitude > 11.0f) magnitude = 11.0f;
          return (int) lroundf((magnitude / 11.0f) * 136.0f);

overview_peak_month_sensor:
  sensor:
  - id: overview_peak_month
    platform: homeassistant
    entity_id: sensor.peak_tarrif_monthly_demand
    on_value:
    - lvgl.label.update:
        id: overview_peak_month_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[18];
          snprintf(buf, sizeof(buf), "%.2f kW", x);
          return std::string(buf);
    - lvgl.bar.update:
        id: overview_peak_month_bar
        value: !lambda |-
          if (std::isnan(x)) return 0;
          float value = x;
          if (value < 0.0f) value = 0.0f;
          if (value > 11.0f) value = 11.0f;
          return (int) (value * 100.0f);


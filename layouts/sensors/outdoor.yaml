solar_total_sensor:
  sensor:
  - id: solar_total
    platform: homeassistant
    entity_id: sensor.total_ac_power_pv
    on_value:
    - lvgl.label.update:
        id: solar_total_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[18];
          snprintf(buf, sizeof(buf), "%.2f kW", x);
          return std::string(buf);


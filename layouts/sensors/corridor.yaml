storage_m1_soc_sensor:
  sensor:
  - id: storage_m1_soc
    platform: homeassistant
    entity_id: sensor.marstek_m1_battery_state_of_charge
    on_value:
    - lvgl.label.update:
        id: storage_m1_soc_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[16];
          snprintf(buf, sizeof(buf), "%.0f%%", x);
          return std::string(buf);
    - lvgl.bar.update:
        id: storage_m1_soc_bar
        value: !lambda |-
          if (std::isnan(x)) return 0;
          float value = x;
          if (value < 0.0f) value = 0.0f;
          if (value > 100.0f) value = 100.0f;
          return (int) value;


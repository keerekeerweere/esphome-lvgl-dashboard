storage_m1_power_sensor:
  sensor:
  - id: storage_m1_power
    platform: homeassistant
    entity_id: sensor.marstek_m1_ac_power_kw
    on_value:
    - lvgl.label.update:
        id: storage_m1_power_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[18];
          snprintf(buf, sizeof(buf), "%+.2f kW", x);
          return std::string(buf);
    - lvgl.bar.update:
        id: storage_m1_power_bar
        value: !lambda |-
          if (std::isnan(x)) return 0;
          float magnitude = x < 0.0f ? -x : x;
          if (magnitude > 11.0f) magnitude = 11.0f;
          return (int) (magnitude * 100.0f);


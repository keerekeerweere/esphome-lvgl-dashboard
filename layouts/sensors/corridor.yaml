storage_m1_power_sensor:
  sensor:
  - id: storage_m1_power
    platform: homeassistant
    entity_id: sensor.marstek_m1_ac_power_kw
    on_value:
    - lvgl.label.update:
        id: storage_m1_power_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[18];
          snprintf(buf, sizeof(buf), "%+.2f kW", x);
          return std::string(buf);

